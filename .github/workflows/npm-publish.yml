# Tests every push and pull request; publishes to npm when main has a
# package.json version newer than the one on npm.
# Publishing uses npm trusted publishing (OIDC): no token, npm trusts this
# workflow file (npm-publish.yml) of edge-ml/javascript.

name: Node.js Package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        env:
          # CPU binaries ship with the package; skip the optional CUDA download
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      - run: npm run build
      - run: npm test
      - run: npm run test:browser

  publish-npm:
    needs: build
    # only from main, never from a pull request
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing
    steps:
      - uses: actions/checkout@v4
      - id: check
        uses: EndBug/version-check@v1
        with:
          file-url: https://unpkg.com/edge-ml@latest/package.json
          static-checking: localIsNew
          file-name: package.json
      - uses: actions/setup-node@v4
        if: steps.check.outputs.changed == 'true'
        with:
          node-version: 24
      # trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@^11.5.1 && npm --version
        if: steps.check.outputs.changed == 'true'
      - run: npm ci
        if: steps.check.outputs.changed == 'true'
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      - run: npm publish
        if: steps.check.outputs.changed == 'true'
      - name: Version unchanged
        run: 'echo "${{steps.check.outputs.changed}}"'
